.word,.sub,.flag .no,.flag .pill,.glass,.name,.meta>div,.pr,.handle{will-change:transform,opacity}

.sub{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:14px;font:800 24px/1 var(--body);letter-spacing:.32em;opacity:.72}
.sub i{width:12px;height:12px;border-radius:50%;display:block}
.flag{position:absolute;left:0;right:0;top:366px;display:flex;justify-content:center;align-items:center;gap:18px}

.flag .pill{display:inline-block;background:var(--red);color:var(--cream);border-radius:999px;padding:14px 26px 12px;font:800 28px/1 var(--body);letter-spacing:.18em}
.glass{position:absolute;left:428px;top:470px;width:224px;height:624px;transform-origin:50% 100%}
.glass svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 30px 34px rgba(0,0,0,.55))}
.gbub{opacity:.5}
.name{position:absolute;left:70px;right:70px;top:1110px;height:250px;display:flex;align-items:flex-end;justify-content:center;
  text-align:center;font-family:var(--disp);line-height:.88;text-transform:uppercase;letter-spacing:.01em}
.meta{position:absolute;left:60px;right:60px;top:1386px;text-align:center}
.brew{font:800 27px/1.1 var(--body);letter-spacing:.24em;text-transform:uppercase;opacity:.72}
.style{font:500 40px/1.2 var(--body);margin-top:12px}.style b{font-weight:800;color:var(--acc)}
.key{font:italic 500 32px/1.25 var(--body);opacity:.72;margin-top:12px}
.prices{position:absolute;left:150px;right:150px;top:1590px;display:flex;justify-content:center;gap:56px;
  border-top:4px dotted rgba(255,253,244,.22);padding-top:20px}
.pr{text-align:center}.pr small{display:block;font:800 22px/1 var(--body);letter-spacing:.14em;opacity:.62;text-transform:uppercase}
.pr b{display:block;font-family:var(--disp);font-weight:400;font-size:84px;line-height:1;margin-top:8px}
.handle{position:absolute;left:0;right:0;top:1748px;text-align:center;font:800 22px/1 var(--body);letter-spacing:.24em;opacity:.55}

/* ------------------------------------------------------------------------ */
function norm(t){
  return String(t==null?"":t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9]+/g,"");
}
function clean(t){ return String(t==null?"":t).replace(/\s+/g," ").trim(); }
function niceName(t){
  t=clean(t);
  if(t && t===t.toLowerCase()) t=t.replace(/(^|\s)(\S)/g,function(m,a,c){return a+c.toUpperCase();});
  return t;
}
function niceStyle(t){ return clean(t).replace(/\s*\/\s*/g," / "); }
function num(n){ if(n==null||String(n).trim()==="") return ""; var x=Number(String(n).replace(",",".")); if(!isFinite(x)||x<=0) return ""; return String(Math.round(x*100)/100); }
function sizeLabel(ml){ var v=Number(ml); return isFinite(v)&&v>0 ? num(v/10)+" cl" : ""; }

/* YHOP draft -> forma minima (quella salvata in cache / snapshot) */
function slim(d){
  return {
    tap: clean(d.identifier), id: d.beer_id, name: d.name, brewery: d.brewery,
    style: d.style, abv: d.abv,
    glasses: (d.glasses||[]).map(function(g){return {volume:g.volume, price:g.price};})
  };
}
function valid(list){
  return Array.isArray(list) && list.length>0 && list.every(function(d){return d && d.tap && clean(d.name);});
}

var byKey={};
var byName={};   /* schede preparate prima che la birra sia su YHOP: nome + birrificio "simile" */
Object.keys(PIVO_BEERS).forEach(function(id){
  var p=PIVO_BEERS[id];
  (p.match||[]).forEach(function(k){ byKey[k]=id; });
  (p.names||[]).forEach(function(n){ (byName[n]=byName[n]||[]).push(id); });
});
function byNameFor(d){
  var c=byName[norm(d.name)], nb=norm(d.brewery);
  if(!c) return null;
  for(var i=0;i<c.length;i++){
    var b=PIVO_BEERS[c[i]].brew||"";
    if(!b || !nb || nb.indexOf(b)>=0 || b.indexOf(nb)>=0) return PIVO_BEERS[c[i]];
  }
  return null;
}
var AI={};
var HEX=/^#[0-9A-Fa-f]{6}$/, DARK_ACC={"#F5263A":1,"#182124":1,"#5A3520":1};
function mix(hex,w){ /* schiarisce un colore verso il bianco (riflesso del bicchiere) */
  var n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  function c(x){ return ("0"+Math.round(x+(255-x)*w).toString(16)).slice(-2); }
  return "#"+c(r)+c(g)+c(b);
}
function validAI(a){
  return a && typeof a.note==="string" && typeof a.noteEn==="string" && GLASS_TPL[a.glass] &&
    HEX.test(a.liq) && HEX.test(a.foam) && HEX.test(a.acc) && Array.isArray(a.meters) && a.meters.length===3 &&
    a.meters.every(function(m){return m>=1&&m<=5;}) && a.chip>=0 && a.chip<=7;
}
function aiProfile(a){
  var acc=a.acc.toUpperCase(), dark=!!DARK_ACC[acc];
  return {ai:true, acc:acc, ink:dark?"#FFFDF4":"#0B1012", note:a.note, noteEn:a.noteEn, meters:a.meters, chip:a.chip,
    svg:fillTpl(a.glass,a.liq,mix(a.liq,.25),a.foam),
    /* sul TV (fondo scuro) gli accenti scuri diventano miele, come nelle schede PIVO */
    tv:{glass:a.glass, liq:a.liq, foam:a.foam, accent:(acc==="#182124"||acc==="#5A3520")?"#FFC24B":acc, key:a.key||"", keyEn:a.keyEn||""}};
}
function profileFor(d){
  if(d.id!=null && PIVO_BEERS[String(d.id)]) return PIVO_BEERS[String(d.id)];
  var k=byKey[norm(d.brewery)+"|"+norm(d.name)];
  if(k) return PIVO_BEERS[k];
  var pre=byNameFor(d); if(pre) return pre;
  var a=d.id!=null ? AI[String(d.id)] : null;
  return validAI(a) ? aiProfile(a) : null;
}
/* parole corte (ipa, apa, dipa, quad) solo come parola intera:
   "New Zealand IPA" e "Cold IPA" non devono diventare "Double IPA" per via di "d ipa" */
var WHOLE={ipa:1,apa:1,dipa:1,quad:1};
function ruleFor(style){
  var s=norm(style);
  var w=" "+String(style==null?"":style).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()+" ";
  for(var i=0;i<PIVO_STYLE_RULES.length;i++){
    var r=PIVO_STYLE_RULES[i];
    if(!r.match.length) return r;
    for(var j=0;j<r.match.length;j++){
      var k=r.match[j];
      if(WHOLE[k] ? w.indexOf(" "+k+" ")>=0 : s.indexOf(k)>=0) return r;
    }
  }
  return PIVO_STYLE_RULES[PIVO_STYLE_RULES.length-1];
}
function fillTpl(key,liq,liq2,foam){
  return (GLASS_TPL[key]||GLASS_TPL.tulip).split("{LIQ}").join(liq).split("{LIQ2}").join(liq2).split("{FOAM}").join(foam);
}

/* scheda + regola + dati YHOP -> birra pronta per menu e TV */
function resolve(d){
  var p=profileFor(d), r=p?null:ruleFor(d.style);
  var prices=(d.glasses||[]).filter(function(g){return g && g.price!=null && isFinite(Number(g.price)) && sizeLabel(g.volume);})
    .sort(function(a,b){return a.volume-b.volume;})
    .map(function(g){return [sizeLabel(g.volume),"€"+num(g.price)];});
  var src=p||r;
  return {
    tap: clean(d.tap), id: d.id,
    name: p&&p.name ? p.name : niceName(d.name),
    brew: clean(d.brewery),
    style: p&&p.style ? p.style : niceStyle(d.style),
    abv: num(d.abv),
    prices: prices,
    word: p&&p.word ? p.word : (ruleFor(d.style).word || niceStyle(d.style)),
    acc: src.acc, ink: src.ink,
    note: src.note, noteEn: src.noteEn,
    meters: src.meters,
    chip: src.chip,
    ring: p&&p.ring ? p.ring : niceName(d.name),
    svg: p ? p.svg : fillTpl(r.glass, r.liq, r.liq2, r.foam),
    tv: p ? p.tv : {glass:r.tvGlass||r.glass, liq:r.tvLiq||r.liq, foam:r.tvFoam||r.foam, accent:r.tvAccent||r.acc, key:r.key, keyEn:r.keyEn||""},
    auto: !p || !!p.ai,
    source: !p ? "stile" : (p.ai ? "ai" : "pivo")
  };
}
function resolveAll(list){
  return list.slice().sort(function(a,b){
    var x=parseFloat(a.tap), y=parseFloat(b.tap);
    if(isFinite(x)&&isFinite(y)&&x!==y) return x-y;
    return String(a.tap).localeCompare(String(b.tap));
  }).map(resolve);
}

function readCache(){
  try{ var c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); if(c && valid(c.list)) return c; }catch(e){}
  return null;
}
function writeCache(list){
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),list:list})); }catch(e){}
}

function readAI(){
  try{ var c=JSON.parse(localStorage.getItem(AI_KEY)||"null"); if(c && typeof c==="object") return c; }catch(e){}
  return {};
}
var OFF=/[?&]yhop=off/.test(location.search);
AI=readAI();
var cached=OFF?null:readCache();
var current=cached ? cached.list : PIVO_SNAPSHOT;
var state={source: cached?"cache":"snapshot", at: cached?cached.t:null};

function fetchLive(){
  return new Promise(function(resolveP,reject){
    if(OFF){ reject(new Error("yhop=off")); return; }
    var ctl=("AbortController" in window)?new AbortController():null;
    var to=setTimeout(function(){ if(ctl) ctl.abort(); reject(new Error("timeout")); },TIMEOUT_MS);
    fetch(YHOP_URL,{cache:"no-store",signal:ctl?ctl.signal:undefined})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(j){
        clearTimeout(to);
        var list=(j && Array.isArray(j.drafts)) ? j.drafts.map(slim) : null;
        if(!valid(list)) throw new Error("dati YHOP non validi");
        resolveP(list);
      })
      .catch(function(e){ clearTimeout(to); reject(e); });
  });
}

function fetchAI(){
  if(!PROFILES_URL || OFF) return Promise.resolve(null);
  return fetch(PROFILES_URL,{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ if(!j || typeof j!=="object" || Array.isArray(j)) throw new Error("schede AI non valide"); return j; });
}
function rendered(){ return JSON.stringify(resolveAll(current)); }

window.PIVO_LIVE={
  /* lista da mostrare subito (cache o snapshot), già risolta */
  initial: function(){ return resolveAll(current); },
  /* legge YHOP; cb(lista risolta, cambiata?) solo se la lettura riesce */
  /* cb(lista risolta, cambiata?) se almeno una lettura (YHOP o schede AI) riesce */
  refresh: function(cb){
    var before=rendered();
    Promise.all([
      fetchLive().catch(function(e){ state.error=String(e&&e.message||e); return null; }),
      fetchAI().catch(function(e){ state.aiError=String(e&&e.message||e); return null; })
    ]).then(function(r){
      var list=r[0], ai=r[1];
      if(list){ current=list; writeCache(list); state.source="yhop"; state.at=Date.now(); }
      else if(window.console) console.info("[PIVO] YHOP non raggiungibile, uso "+state.source+":",state.error);
      if(ai){ AI=ai; try{ localStorage.setItem(AI_KEY,JSON.stringify(ai)); }catch(e){} }
      if(!list && !ai) return;
      var res=resolveAll(current);
      cb && cb(res, JSON.stringify(res)!==before);
    });
  },
  state: function(){ return state; },
  /* per la story del robot: una singola birra YHOP (formato grezzo) -> scheda pronta */
  resolveDraft: function(d){ return resolve(slim(d)); },
  setAI: function(obj){ if(obj && typeof obj==="object") AI=obj; }
};
})();
</script>
<script>
/* PIVO STORY — animazione a tempo (deterministica): renderStory(draft, ai, flag, opts) costruisce la pagina,
   storyFrame(t) disegna l'istante t (secondi). Durata STORY_DURATION. Nessuna animazione CSS:
   ogni fotogramma si cattura uguale su qualsiasi computer. */
(function(){
"use strict";
var DUR=8;
var GL={
 pilsner:{d:"M33 36 L48 258 Q49 268 59 268 L61 268 Q71 268 72 258 L87 36 Z", bottom:268, rim:[33,87], extra:""},
 nonic:{d:"M31 36 L31 88 L25 104 L34 122 L45 258 Q46 268 56 268 L64 268 Q74 268 75 258 L86 122 L95 104 L89 88 L89 36 Z", bottom:268, rim:[31,89], extra:""},
 tulip:{d:"M29 36 C25 98 37 134 55 152 L65 152 C83 134 95 98 91 36 Z", bottom:152, rim:[29,91],
        extra:'<path d="M55 152 L55 236 M65 152 L65 236"/><path d="M33 264 Q60 240 87 264"/>'},
 snifter:{d:"M25 58 C25 126 40 158 60 163 C80 158 95 126 95 58 C95 42 82 36 60 36 C38 36 25 42 25 58 Z", bottom:163, rim:[40,80],
        extra:'<path d="M57 164 L57 232 M63 164 L63 232"/><path d="M34 262 Q60 238 86 262"/>'},
 weizen:{d:"M35 36 L30 68 C30 102 46 118 46 150 L46 212 C46 242 36 250 34 266 L86 266 C84 250 74 242 74 212 L74 150 C74 118 90 102 90 68 L85 36 Z", bottom:266, rim:[35,85], extra:""}
};
var TOP=44;
function clamp(x){ return x<0?0:x>1?1:x; }
function seg(t,a,b){ return clamp((t-a)/(b-a)); }
function eOut(x){ return 1-Math.pow(1-x,3); }
function eBack(x){ var c=1.9; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shade(hex,k){ var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  function c(v){ v=k<0?v*(1+k):v+(255-v)*k; return ("0"+Math.round(v).toString(16)).slice(-2); } return "#"+c(r)+c(g)+c(b); }
var S=null;   /* stato della story corrente */

/* bolle: posizioni fisse, generate da un seme (sempre uguali) */
var BUB=[]; (function(){ var s=7; function r(){ s=(s*9301+49297)%233280; return s/233280; }
  for(var i=0;i<16;i++) BUB.push({x:44+r()*32, sp:38+r()*46, ph:r(), rad:1.1+r()*1.6}); })();

function glassFrame(t){
  var g=S.g, p=eOut(seg(t,1.0,3.6));                         /* livello: 0 → pieno */
  var surf=g.bottom-(g.bottom-TOP)*p;
  var amp=0.6+3.2*(1-p)*Math.min(1,t);                         /* onde forti durante la spillatura */
  var foamH=4+12*seg(t,1.2,3.4);
  var pts=[], top=[];
  for(var x=0;x<=120;x+=4){
    var y=surf+amp*Math.sin(x*0.16+t*7.0)+amp*0.5*Math.sin(x*0.31-t*4.3);
    pts.push(x+","+y.toFixed(2)); top.push([x,y]);
  }
  var liq='M0,'+(top[0][1])+' L'+pts.join(' L')+' L120,320 L0,320 Z';
  var fm='M'+top.map(function(q){ return q[0]+","+(q[1]-foamH).toFixed(2); }).join(' L')+
         ' L'+top.slice().reverse().map(function(q){ return q[0]+","+(q[1]+2).toFixed(2); }).join(' L')+' Z';
  var caps="";
  if(p>0.02) for(var i=0;i<top.length;i+=2){ var q=top[i];
    caps+='<circle cx="'+q[0]+'" cy="'+(q[1]-foamH+1.5).toFixed(2)+'" r="'+(3.2+((i*7)%4)*0.6+0.5*Math.sin(t*3+i)).toFixed(2)+'"/>'; }

  });
  /* cappello di schiuma sopra il bordo, quando il bicchiere è pieno */
  var dome="", dp=eBack(seg(t,3.3,3.9)), br=1+0.04*Math.sin(t*2.4);
  if(dp>0){ for(var x2=g.rim[0]+5, j=0; x2<=g.rim[1]-5; x2+=6, j++){
      dome+='<circle cx="'+x2+'" cy="'+(37-(j%2)*1.6)+'" r="'+((5.4+(j*5%3)*0.7)*dp*br).toFixed(2)+'"/>'; } }
  var shine=((t*0.55)%1.6)-0.3, sx=-30+shine*170;
  S.svg.innerHTML=
    '<defs><clipPath id="sgc"><path d="'+g.d+'"/></clipPath>'+
    '<linearGradient id="sgd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/>'+
    '<stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient></defs>'+
    '<g clip-path="url(#sgc)">'+
      '<path d="'+liq+'" fill="'+S.liq+'"/><path d="'+liq+'" fill="url(#sgd)"/>'+bub+
      (p>0.01?'<path d="'+fm+'" fill="'+S.foam+'"/><g fill="'+S.foam+'">'+caps+'</g>':'')+
      '<polygon points="'+sx+',28 '+(sx+14)+',28 '+(sx+2)+',280 '+(sx-12)+',280" fill="#fff" opacity=".18"/>'+
    '</g>'+
    '<path d="'+g.d+'" fill="#fff" fill-opacity=".04" stroke="#FFFDF4" stroke-opacity=".8" stroke-width="3.2" stroke-linejoin="round"/>'+
    '<g fill="none" stroke="#FFFDF4" stroke-opacity=".8" stroke-width="3.2" stroke-linecap="round">'+g.extra+'</g>'+
    '<g fill="'+S.foam+'">'+dome+'</g>';
}

window.STORY_DURATION=DUR;
window.renderStory=function(draft, ai, flag, opts){
  opts=opts||{};
  if(ai) window.PIVO_LIVE.setAI(ai);
  var b=window.PIVO_LIVE.resolveDraft(draft), tv=b.tv;
  var acc=tv.accent||b.acc, style=(b.style.length>22&&b.word)?b.word:b.style;
  var prices=opts.noPrices?[]:(b.prices||[]);
  var st=document.getElementById("st"); st.style.setProperty("--acc",acc);
  st.innerHTML='<div class="glow"></div><div class="ring a"></div><div class="ring b"></div>'+
    '<div class="top"><div class="word">PIVO</div><div class="sub"><i style="background:var(--red)"></i><i style="background:var(--honey)"></i><i style="background:var(--teal)"></i>ALLA SPINA · BERGAMO</div></div>'+
    '<div class="flag">'+(opts.noTap||!b.tap?'':'<div class="no">'+esc(b.tap)+'</div>')+'<div class="pill">'+esc(flag||"NUOVA SPINA")+'</div></div>'+
    '<div class="glass"><svg viewBox="18 22 84 256" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>'+
    '<div class="name"><span>'+esc(b.name)+'</span></div>'+
    '<div class="meta"><div class="brew">'+esc(b.brew)+'</div>'+
      '<div class="style">'+esc(style)+(b.abv?' · <b>'+esc(String(b.abv).replace(".",","))+'%</b>':'')+'</div>'+
      (tv.key?'<div class="key">'+esc(tv.key)+'</div>':'')+'</div>'+
    (prices.length?'<div class="prices">'+prices.map(function(p){ return '<div class="pr"><small>'+esc(p[0])+'</small><b>'+esc(p[1])+'</b></div>'; }).join("")+'</div>':'')+
    '<div class="handle">@PIVOBIRRERIABERGAMO</div>';
  /* nome: il più grande possibile su 2 righe senza spezzare parole */
  var box=st.querySelector(".name"), sp=box.firstChild, size=200;
  sp.style.fontSize=size+"px";
  while(size>60 && (sp.offsetHeight>box.clientHeight || sp.scrollWidth>box.clientWidth+1)){ size-=4; sp.style.fontSize=size+"px"; }
  var probe=document.createElement("span"); probe.style.cssText="position:absolute;visibility:hidden;white-space:nowrap;font-family:var(--disp);text-transform:uppercase";
  st.appendChild(probe);
  b.name.split(/\s+/).forEach(function(w){ probe.textContent=w; probe.style.fontSize=size+"px";
    while(size>60 && probe.offsetWidth>box.clientWidth){ size-=4; probe.style.fontSize=size+"px"; } });
  probe.remove(); sp.style.fontSize=size+"px";
  S={g:GL[tv.glass]||GL.tulip, liq:tv.liq, foam:tv.foam, st:st, svg:st.querySelector(".glass svg"),
     q:function(s){ return st.querySelector(s); }, qa:function(s){ return [].slice.call(st.querySelectorAll(s)); }};
  window.storyFrame(DUR);
  return {name:b.name, tap:b.tap, source:b.source};
};
function set(el,o,tx,ty,sc,rot){ if(!el) return; el.style.opacity=o;
  el.style.transform='translate('+(tx||0)+'px,'+(ty||0)+'px) scale('+(sc==null?1:sc)+') rotate('+(rot||0)+'deg)'; }
window.storyFrame=function(t){
  if(!S) return;
  var q=S.q;
  set(q(".ring.a"),0.07,0,0,1,t*6); set(q(".ring.b"),0.07,0,0,1,-t*9);
  var gl=seg(t,0.2,1.6); q(".glow").style.opacity=(eOut(gl)*(0.85+0.15*Math.sin(t*2.2))).toFixed(3);
  var w=eOut(seg(t,0,0.7)); set(q(".word"),w,0,(1-w)*-40);
  var jit=(t>0.55&&t<0.75)?6:0; q(".word").style.textShadow=(-6-jit)+'px 0 0 var(--teal),'+(6+jit)+'px 0 0 var(--red)';
  var sb=eOut(seg(t,0.3,0.9)); set(q(".sub"),sb,0,(1-sb)*-16);
  var no=seg(t,0.6,1.15); set(q(".flag .no"),Math.min(1,no*2),0,0,0.4+0.6*eBack(no));
  /* NUOVA SPINA: entra con un rimbalzo, poi ogni 1,6 s fa un piccolo scatto */
  var pp=seg(t,0.85,1.4), base=0.2+0.8*eBack(pp), k=((t-1.6)%1.6+1.6)%1.6, wig=t>1.6&&k<0.45?Math.sin(k/0.45*Math.PI*3)*(1-k/0.45):0;
  set(q(".flag .pill"),Math.min(1,pp*2),0,0,base*(1+0.07*Math.abs(wig)),wig*5);
  q(".flag .pill").style.boxShadow='0 0 '+(18+14*Math.abs(Math.sin(t*2.6)))+'px rgba(245,38,58,'+(0.35+0.25*Math.abs(Math.sin(t*2.6))).toFixed(2)+')';
  var gi=eOut(seg(t,0.4,1.0)); set(q(".glass"),gi,0,(1-gi)*40,0.92+0.08*gi);
  glassFrame(t);
  var nm=eOut(seg(t,1.7,2.5)); set(q(".name"),nm,0,(1-nm)*70);
  var parts=S.qa(".meta>div"); parts.forEach(function(el,i){ var e=eOut(seg(t,2.3+i*0.18,2.9+i*0.18)); set(el,e,0,(1-e)*24); });
  S.qa(".pr").forEach(function(el,i){ var e=seg(t,3.0+i*0.18,3.5+i*0.18); set(el,Math.min(1,e*2),0,0,0.5+0.5*eBack(e)); });
  var line=q(".prices"); if(line) line.style.borderTopColor='rgba(255,253,244,'+(0.22*eOut(seg(t,2.9,3.4))).toFixed(3)+')';
  var hd=eOut(seg(t,3.6,4.2)); set(q(".handle"),hd*0.55,0,(1-hd)*14);
};
})();
