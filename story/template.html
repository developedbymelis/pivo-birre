.word,.sub,.flag .no,.flag .pill,.glass,.name,.meta>div,.pr,.handle{will-change:transform,opacity}

.sub{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:14px;font:800 24px/1 var(--body);letter-spacing:.32em;opacity:.72}
.sub i{width:12px;height:12px;border-radius:50%;display:block}
.flag{position:absolute;left:0;right:0;top:366px;display:flex;justify-content:center;align-items:center;gap:18px}
.flag .no{width:78px;height:78px;border-radius:50%;border:6px solid var(--acc);color:var(--acc);display:flex;align-items:center;
  justify-content:center;font-family:var(--disp);font-size:50px;padding-top:6px}
.flag .pill{display:inline-block;background:var(--red);color:var(--cream);border-radius:999px;padding:14px 26px 12px;font:800 28px/1 var(--body);letter-spacing:.18em}
.glass{position:absolute;left:428px;top:470px;width:224px;height:624px;transform-origin:50% 100%}
.glass svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 30px 34px rgba(0,0,0,.55))}
.gbub{opacity:.5}
.name{position:absolute;left:70px;right:70px;top:1110px;height:250px;display:flex;align-items:flex-end;justify-content:center;
  text-align:center;font-family:var(--disp);line-height:.88;text-transform:uppercase;letter-spacing:.01em}
.meta{position:absolute;left:60px;right:60px;top:1386px;text-align:center}
.brew{font:800 27px/1.1 var(--body);letter-spacing:.24em;text-transform:uppercase;opacity:.72}
.style{font:500 40px/1.2 var(--body);margin-top:12px}.style b{font-weight:800;color:var(--acc)}
.key{font:italic 500 32px/1.25 var(--body);opacity:.72;margin-top:12px}
.prices{position:absolute;left:150px;right:150px;top:1590px;display:flex;justify-content:center;gap:56px;
  border-top:4px dotted rgba(255,253,244,.22);padding-top:20px}
.pr{text-align:center}.pr small{display:block;font:800 22px/1 var(--body);letter-spacing:.14em;opacity:.62;text-transform:uppercase}
.pr b{display:block;font-family:var(--disp);font-weight:400;font-size:84px;line-height:1;margin-top:8px}
.handle{position:absolute;left:0;right:0;top:1748px;text-align:center;font:800 22px/1 var(--body);letter-spacing:.24em;opacity:.55}

/* bolle: posizioni fisse, generate da un seme (sempre uguali) */
var BUB=[]; (function(){ var s=7; function r(){ s=(s*9301+49297)%233280; return s/233280; }
  for(var i=0;i<16;i++) BUB.push({x:44+r()*32, sp:38+r()*46, ph:r(), rad:1.1+r()*1.6}); })();

function glassFrame(t){
  var g=S.g, p=eOut(seg(t,1.0,3.6));                         /* livello: 0 → pieno */
  var surf=g.bottom-(g.bottom-TOP)*p;
  var amp=0.6+3.2*(1-p)*Math.min(1,t);                         /* onde forti durante la spillatura */
  var foamH=4+12*seg(t,1.2,3.4);
  var pts=[], top=[];
  for(var x=0;x<=120;x+=4){
    var y=surf+amp*Math.sin(x*0.16+t*7.0)+amp*0.5*Math.sin(x*0.31-t*4.3);
    pts.push(x+","+y.toFixed(2)); top.push([x,y]);
  }
  var liq='M0,'+(top[0][1])+' L'+pts.join(' L')+' L120,320 L0,320 Z';
  var fm='M'+top.map(function(q){ return q[0]+","+(q[1]-foamH).toFixed(2); }).join(' L')+
         ' L'+top.slice().reverse().map(function(q){ return q[0]+","+(q[1]+2).toFixed(2); }).join(' L')+' Z';
  var caps="";
  if(p>0.02) for(var i=0;i<top.length;i+=2){ var q=top[i];
    caps+='<circle cx="'+q[0]+'" cy="'+(q[1]-foamH+1.5).toFixed(2)+'" r="'+(3.2+((i*7)%4)*0.6+0.5*Math.sin(t*3+i)).toFixed(2)+'"/>'; }
  var bub="";
  if(t>1.2) BUB.forEach(function(b){
    var range=g.bottom-TOP, y=g.bottom-4-((t*b.sp+b.ph*range)%range), x=b.x+1.2*Math.sin(t*3+b.ph*9);
    if(y>surf+3) bub+='<circle cx="'+x.toFixed(2)+'" cy="'+y.toFixed(2)+'" r="'+b.rad.toFixed(2)+'" fill="#fff" opacity=".55"/>';
  });
  /* cappello di schiuma sopra il bordo, quando il bicchiere è pieno */
  var dome="", dp=eBack(seg(t,3.3,3.9)), br=1+0.04*Math.sin(t*2.4);
  if(dp>0){ for(var x2=g.rim[0]+5, j=0; x2<=g.rim[1]-5; x2+=6, j++){
      dome+='<circle cx="'+x2+'" cy="'+(37-(j%2)*1.6)+'" r="'+((5.4+(j*5%3)*0.7)*dp*br).toFixed(2)+'"/>'; } }
  var shine=((t*0.55)%1.6)-0.3, sx=-30+shine*170;
  S.svg.innerHTML=
    '<defs><clipPath id="sgc"><path d="'+g.d+'"/></clipPath>'+
    '<linearGradient id="sgd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/>'+
    '<stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient></defs>'+
    '<g clip-path="url(#sgc)">'+
      '<path d="'+liq+'" fill="'+S.liq+'"/><path d="'+liq+'" fill="url(#sgd)"/>'+bub+
      (p>0.01?'<path d="'+fm+'" fill="'+S.foam+'"/><g fill="'+S.foam+'">'+caps+'</g>':'')+
      '<polygon points="'+sx+',28 '+(sx+14)+',28 '+(sx+2)+',280 '+(sx-12)+',280" fill="#fff" opacity=".18"/>'+
    '</g>'+
    '<path d="'+g.d+'" fill="#fff" fill-opacity=".04" stroke="#FFFDF4" stroke-opacity=".8" stroke-width="3.2" stroke-linejoin="round"/>'+
    '<g fill="none" stroke="#FFFDF4" stroke-opacity=".8" stroke-width="3.2" stroke-linecap="round">'+g.extra+'</g>'+
    '<g fill="'+S.foam+'">'+dome+'</g>';
}

window.STORY_DURATION=DUR;
window.renderStory=function(draft, ai, flag, opts){
  opts=opts||{};
  if(ai) window.PIVO_LIVE.setAI(ai);
  var b=window.PIVO_LIVE.resolveDraft(draft), tv=b.tv;
  var acc=tv.accent||b.acc, style=(b.style.length>22&&b.word)?b.word:b.style;
  var prices=opts.noPrices?[]:(b.prices||[]);
  var st=document.getElementById("st"); st.style.setProperty("--acc",acc);
  st.innerHTML='<div class="glow"></div><div class="ring a"></div><div class="ring b"></div>'+
    '<div class="top"><div class="word">PIVO</div><div class="sub"><i style="background:var(--red)"></i><i style="background:var(--honey)"></i><i style="background:var(--teal)"></i>ALLA SPINA · BERGAMO</div></div>'+
    '<div class="flag">'+(opts.noTap||!b.tap?'':'<div class="no">'+esc(b.tap)+'</div>')+'<div class="pill">'+esc(flag||"NUOVA SPINA")+'</div></div>'+
    '<div class="glass"><svg viewBox="18 22 84 256" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>'+
    '<div class="name"><span>'+esc(b.name)+'</span></div>'+
    '<div class="meta"><div class="brew">'+esc(b.brew)+'</div>'+
      '<div class="style">'+esc(style)+(b.abv?' · <b>'+esc(String(b.abv).replace(".",","))+'%</b>':'')+'</div>'+
      (tv.key?'<div class="key">'+esc(tv.key)+'</div>':'')+'</div>'+
    (prices.length?'<div class="prices">'+prices.map(function(p){ return '<div class="pr"><small>'+esc(p[0])+'</small><b>'+esc(p[1])+'</b></div>'; }).join("")+'</div>':'')+
    '<div class="handle">@PIVOBIRRERIABERGAMO</div>';
  /* nome: il più grande possibile su 2 righe senza spezzare parole */
  var box=st.querySelector(".name"), sp=box.firstChild, size=200;
  sp.style.fontSize=size+"px";
  while(size>60 && (sp.offsetHeight>box.clientHeight || sp.scrollWidth>box.clientWidth+1)){ size-=4; sp.style.fontSize=size+"px"; }
  var probe=document.createElement("span"); probe.style.cssText="position:absolute;visibility:hidden;white-space:nowrap;font-family:var(--disp);text-transform:uppercase";
  st.appendChild(probe);
  b.name.split(/\s+/).forEach(function(w){ probe.textContent=w; probe.style.fontSize=size+"px";
    while(size>60 && probe.offsetWidth>box.clientWidth){ size-=4; probe.style.fontSize=size+"px"; } });
  probe.remove(); sp.style.fontSize=size+"px";
  S={g:GL[tv.glass]||GL.tulip, liq:tv.liq, foam:tv.foam, st:st, svg:st.querySelector(".glass svg"), acc:acc,
     q:function(s){ return st.querySelector(s); }, qa:function(s){ return [].slice.call(st.querySelectorAll(s)); }};
  /* animazione speciale per questo nome? */
  var fx=opts.fx===false?null:FX[nkey(b.name)]||null;
  window.STORY_SOUNDS=[]; S.fx=null; S.shift=0;
  if(fx) setupFx(fx, b.name, sp, st);
  window.storyFrame(DUR);
  return {name:b.name, tap:b.tap, source:b.source, fx:S.fx?S.fx.type:null, sounds:window.STORY_SOUNDS};
};
function wordSpans(sp, groups, cls){
  sp.innerHTML=groups.map(function(g){ return '<span class="'+cls+'" style="display:inline-block">'+esc(g)+'</span>'; }).join(" ");
}
function setupFx(fx, name, sp, st){
  var words=name.trim().split(/\s+/), T=fx.type, F={type:T};
  if(T==="knock"){
    var n=fx.times.length, groups=[]; for(var i=0;i<n;i++) groups.push([]);
    words.forEach(function(w,i){ groups[Math.min(n-1,Math.floor(i*n/words.length))].push(w); });
    groups=groups.filter(function(g){ return g.length; }).map(function(g){ return g.join(" "); });
    wordSpans(sp, groups, "kw"); F.times=fx.times.slice(0,groups.length); F.words=S.qa(".name .kw");
    F.end=F.times[F.times.length-1];
    window.STORY_SOUNDS=F.times.map(function(tt,i){ return {t:tt, sound:(fx.sounds||[])[i]||"knock1"}; });
  } else if(T==="countdown"){
    var c=document.createElement("div"); c.className="fx-timer";
    c.style.cssText="position:absolute;left:0;right:0;top:1150px;text-align:center;font-family:var(--disp);font-size:110px;line-height:1;letter-spacing:.06em;color:var(--honey);opacity:0";
    st.appendChild(c); F.timer=c; F.a=1.5; F.b=2.6; F.end=2.9;
    window.STORY_SOUNDS=[{t:F.b, sound:"tick"}];
  } else if(T==="run"){
    sp.innerHTML=words.map(function(w){ return '<span style="display:inline-block;white-space:nowrap">'+w.split("").map(function(ch){
      return '<span class="rl" style="display:inline-block">'+esc(ch)+'</span>'; }).join("")+'</span>'; }).join(" ");
    F.letters=S.qa(".name .rl"); F.end=1.7+F.letters.length*0.045+0.45;
  } else if(T==="frost"){ F.end=2.9;
  } else if(T==="warp"){
    var lines=""; for(var k=0;k<18;k++){ var ang=k*20+(k%3)*7; lines+='<i style="position:absolute;left:540px;top:1235px;height:3px;width:0;'+
      'background:linear-gradient(90deg,rgba(255,253,244,0),rgba(255,253,244,.9));transform-origin:0 50%;transform:rotate('+ang+'deg) translateX(60px)"></i>'; }
    var w=document.createElement("div"); w.className="fx-warp"; w.style.cssText="position:absolute;inset:0;pointer-events:none"; w.innerHTML=lines;
    st.insertBefore(w, st.querySelector(".name")); F.lines=[].slice.call(w.children); F.end=2.6;
    window.STORY_SOUNDS=[{t:1.6, sound:"swoosh"}];
  } else if(T==="heart"){
    wordSpans(sp, [words[0]].concat(words.length>1?[words.slice(1).join(" ")]:[]), "hw");
    var first=S.q(".name .hw");
    first.innerHTML+='<svg class="fx-heart" viewBox="0 0 24 22" style="position:absolute;width:.34em;height:.34em;top:-.2em;right:-.36em;overflow:visible">'+
      '<path d="M12 21 C5 15 1 11 1 6.5 A5.5 5.5 0 0 1 12 4 A5.5 5.5 0 0 1 23 6.5 C23 11 19 15 12 21Z" fill="var(--red)"/></svg>';
    first.style.position="relative"; F.heart=first.querySelector(".fx-heart"); F.end=2.9; F.beats=fx.beats||[2.55,2.8];
    window.STORY_SOUNDS=[{t:2.55, sound:"beat"},{t:2.80, sound:"beat"}];
  } else if(T==="escape"){ F.end=2.75;
  } else if(T==="notes"){
    wordSpans(sp, words, "nw"); F.words=S.qa(".name .nw");
    F.words.forEach(function(el){ el.style.position="relative";
      el.insertAdjacentHTML("beforeend",'<span class="fx-note" style="position:absolute;left:50%;top:-.35em;font-size:.32em;color:var(--honey);opacity:0">&#9834;</span>'); });
    F.end=1.75+F.words.length*0.26+0.3;
  }
  if(fx.music) window.STORY_SOUNDS.push({t:0, sound:fx.music});
  (fx.sfx||[]).forEach(function(a){ window.STORY_SOUNDS.push({t:a[0], sound:a[1]}); });   /* sottofondo musicale, se c'è */
  window.STORY_SOUNDS=window.STORY_SOUNDS.filter(function(x){ return /^music_/.test(x.sound) ? MUSIC : (!!SFX_OK[x.sound] || /^sfx_/.test(x.sound)); });
  S.fx=F; S.shift=Math.max(0,F.end+0.3-2.3);
}
function fxFrame(t){
  var F=S.fx, q=S.q, name=q(".name"), shake=0;
  if(F.type==="knock"){
    set(name,1,0,0);
    F.words.forEach(function(el,i){
      var d=t-F.times[i];
      if(d<0){ el.style.opacity=0; return; }
      var e=eOut(seg(d,0,0.16)), rot=[-4,3,-2,2][i%4]*(1-e);
      el.style.opacity=Math.min(1,d/0.04);
      el.style.transform='scale('+(1.7-0.7*e).toFixed(3)+') rotate('+rot.toFixed(2)+'deg)';
      el.style.color=d<0.14?S.acc:"";
      if(d<0.24) shake+=9*(1-d/0.24)*Math.sin(d*95);
    });
  } else if(F.type==="countdown"){
    var p=seg(t,F.a,F.b), sec=Math.round(300*(1-eOut(p)*1)), mm=Math.floor(sec/60), ss=sec%60;
    F.timer.textContent=mm+":"+("0"+ss).slice(-2);
    var tin=eOut(seg(t,F.a-0.25,F.a)), tout=eOut(seg(t,F.b+0.04,F.b+0.26));
    F.timer.style.opacity=(tin*(1-tout)).toFixed(3);
    F.timer.style.transform='translateY('+(-90*tout).toFixed(1)+'px) scale('+(t>F.b&&t<F.b+0.12?1.12:1)+')';
    F.timer.style.color=t>=F.b?'var(--red)':'var(--honey)';
    var e=eBack(seg(t,F.b+0.14,F.b+0.48)); set(name,Math.min(1,seg(t,F.b+0.14,F.b+0.24)*1.5),0,0,0.6+0.4*e);
  } else if(F.type==="run"){
    set(name,1,0,0);
    F.letters.forEach(function(el,i){
      var d=seg(t,1.7+i*0.045,1.7+i*0.045+0.42), e=eBack(d);
      el.style.opacity=Math.min(1,d*3);
      el.style.transform='translateX('+((1-e)*520).toFixed(1)+'px) skewX('+(-22*(1-eOut(d))).toFixed(1)+'deg)';
    });
  } else if(F.type==="frost"){
    var a=eOut(seg(t,1.5,1.9)), m=seg(t,2.0,2.9);
    set(name,a,0,(1-a)*20);
    name.style.filter='blur('+(8*(1-eOut(m))).toFixed(2)+'px)';
    name.style.color=m<1?'rgba('+Math.round(170+85*m)+','+Math.round(225+28*m)+','+Math.round(255-11*m)+',1)':'';
    name.style.textShadow=m<1?'0 0 '+(28*(1-m)).toFixed(1)+'px rgba(160,225,255,'+(0.9*(1-m)).toFixed(2)+')':'';
  } else if(F.type==="warp"){
    var w=seg(t,1.55,2.4), e2=eOut(w);
    set(name,Math.min(1,w*2.5),0,0,0.06+0.94*e2);
    name.style.filter='blur('+(6*(1-e2)).toFixed(2)+'px)';
    F.lines.forEach(function(el,i){ var l=seg(t,1.55+(i%4)*0.04,2.3), len=l<0.5?l*2*900:(1-l)*2*900;
      el.style.width=Math.max(0,len).toFixed(0)+'px'; el.style.opacity=(l>0&&l<1)?0.8:0; });
  } else if(F.type==="heart"){
    var hn=eOut(seg(t,1.7,2.5)); set(name,hn,0,(1-hn)*70);
    var h=F.heart, hi=eBack(seg(t,2.3,2.5)), beat=0;
    F.beats.forEach(function(b0,k){ var d=t-b0; if(d>=0&&d<0.22) beat=Math.max(beat,(k<2?(k?0.22:0.32):0.16)*(1-d/0.22)); });
    h.style.opacity=Math.min(1,seg(t,2.3,2.4)*1.5); h.style.transform='scale('+(hi*(1+beat)).toFixed(3)+')';
  } else if(F.type==="escape"){
    var u=seg(t,1.6,2.35), path=eOut(u), bx=0, by=0;
    var dx=-700*(1-path), dy=520*(1-path)+(-120*Math.sin(Math.PI*path));
    var bounce=seg(t,2.35,2.75); if(bounce>0){ bx=28*Math.sin(bounce*Math.PI)*(1-bounce); }
    set(name,Math.min(1,u*3),dx+bx,dy,1,(1-path)*-14+bx*0.3);
  } else if(F.type==="notes"){
    set(name,1,0,0);
    F.words.forEach(function(el,i){
      var t0=1.75+i*0.26, d=seg(t,t0,t0+0.38), hop=Math.sin(Math.PI*Math.min(1,d))*-70*(1-d*0.3);
      el.style.opacity=Math.min(1,d*4);
      el.style.transform='translateY('+(d<1?(60*(1-d)+hop):0).toFixed(1)+'px)';
      var note=el.querySelector(".fx-note"), nd=seg(t,t0+0.1,t0+0.9);
      if(note){ note.style.opacity=(nd>0&&nd<1?Math.sin(Math.PI*nd):0).toFixed(2); note.style.transform='translate(-50%,'+(-60*nd).toFixed(1)+'px)'; }
    });
  }
  S.st.style.transform=shake?'translate('+shake.toFixed(2)+'px,'+(shake*0.35).toFixed(2)+'px)':'';
}
function set(el,o,tx,ty,sc,rot){ if(!el) return; el.style.opacity=o;
  el.style.transform='translate('+(tx||0)+'px,'+(ty||0)+'px) scale('+(sc==null?1:sc)+') rotate('+(rot||0)+'deg)'; }
window.storyFrame=function(t){
  if(!S) return;
  var q=S.q;
  set(q(".ring.a"),0.07,0,0,1,t*6); set(q(".ring.b"),0.07,0,0,1,-t*9);
  var gl=seg(t,0.2,1.6); q(".glow").style.opacity=(eOut(gl)*(0.85+0.15*Math.sin(t*2.2))).toFixed(3);
  var w=eOut(seg(t,0,0.7)); set(q(".word"),w,0,(1-w)*-40);
  var jit=(t>0.55&&t<0.75)?6:0; q(".word").style.textShadow=(-6-jit)+'px 0 0 var(--teal),'+(6+jit)+'px 0 0 var(--red)';
  var sb=eOut(seg(t,0.3,0.9)); set(q(".sub"),sb,0,(1-sb)*-16);
  var no=seg(t,0.6,1.15); set(q(".flag .no"),Math.min(1,no*2),0,0,0.4+0.6*eBack(no));
  /* NUOVA SPINA: entra con un rimbalzo, poi ogni 1,6 s fa un piccolo scatto */
  var pp=seg(t,0.85,1.4), base=0.2+0.8*eBack(pp), k=((t-1.6)%1.6+1.6)%1.6, wig=t>1.6&&k<0.45?Math.sin(k/0.45*Math.PI*3)*(1-k/0.45):0;
  set(q(".flag .pill"),Math.min(1,pp*2),0,0,base*(1+0.07*Math.abs(wig)),wig*5);
  q(".flag .pill").style.boxShadow='0 0 '+(18+14*Math.abs(Math.sin(t*2.6)))+'px rgba(245,38,58,'+(0.35+0.25*Math.abs(Math.sin(t*2.6))).toFixed(2)+')';
  var gi=eOut(seg(t,0.4,1.0)); set(q(".glass"),gi,0,(1-gi)*40,0.92+0.08*gi);
  glassFrame(t);
  var D=S.shift;
  if(S.fx) fxFrame(t);
  else { var nm=eOut(seg(t,1.7,2.5)); set(q(".name"),nm,0,(1-nm)*70); }
  var parts=S.qa(".meta>div"); parts.forEach(function(el,i){ var e=eOut(seg(t,D+2.3+i*0.18,D+2.9+i*0.18)); set(el,e,0,(1-e)*24); });
  S.qa(".pr").forEach(function(el,i){ var e=seg(t,D+3.0+i*0.18,D+3.5+i*0.18); set(el,Math.min(1,e*2),0,0,0.5+0.5*eBack(e)); });
  var line=q(".prices"); if(line) line.style.borderTopColor='rgba(255,253,244,'+(0.22*eOut(seg(t,D+2.9,D+3.4))).toFixed(3)+')';
  var hd=eOut(seg(t,D+3.6,D+4.2)); set(q(".handle"),hd*0.55,0,(1-hd)*14);
};
})();
</script></body></html>
